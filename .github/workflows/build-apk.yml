name: Build APK
on: [push, workflow_dispatch]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Buat Proyek & Compile APK
        run: |
          mkdir -p src/main/java/id/qc src/main/assets src/main/res/drawable
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'KalkulatorTekstilQC'
          EOF
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.5.0' }
          android {
            namespace 'id.qc'
            compileSdk 34
            defaultConfig { applicationId 'id.qc.textile'; minSdk 24; targetSdk 34; versionCode 2; versionName '1.1' }
          }
          EOF
          cat << 'EOF' > src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#2E5A44" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M34,24h40v8h-40zM38,35h32l-4,38h-24zM34,76h40v8h-40z"/>
            <path android:fillColor="#A7D7C5" android:pathData="M36,44h36v5h-36zM37,53h34v5h-34zM38,62h32v5h-32z"/>
          </vector>
          EOF
          cat << 'EOF' > src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Kalkulator Tekstil QC" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat << 'EOF' > src/main/java/id/qc/MainActivity.java
          package id.qc;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          EOF
          cat << 'EOF' > src/main/assets/index.html
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          body{font-family:sans-serif;margin:0;background:#F4F7F5;color:#222;padding-bottom:75px}
          header{background:#2E5A44;color:#fff;padding:14px 16px;font-weight:bold;font-size:17px}
          header small{display:block;font-weight:normal;font-size:11px;opacity:.85;margin-top:2px}
          .card{background:#fff;margin:12px;padding:14px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
          h3{margin:0 0 10px;color:#2E5A44;font-size:14px}
          label{display:block;font-size:12px;margin-top:8px;color:#555}
          .g2{display:flex;gap:8px}.g2>div{flex:1}
          input,select{width:100%;padding:9px;margin-top:3px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font-size:14px;background:#fff}
          .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:13px}
          .row b{color:#2E5A44;font-size:15px}
          nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;border-top:1px solid #ddd}
          nav button{flex:1;padding:8px 2px;border:none;background:none;font-size:11px;font-weight:bold;color:#666}
          nav button i{display:block;font-style:normal;font-size:16px;margin-bottom:2px}
          nav button.on{color:#2E5A44;border-top:3px solid #2E5A44}
          .tab{display:none}.tab.on{display:block}
          </style></head><body>
          <header>🧵 Kalkulator Tekstil & Spinning QC<small>Konversi • Twist & Draft • Produksi • Timbang QC</small></header>
          <div id="t0" class="tab on"><div class="card"><h3>Konversi Nomor Benang</h3>
          <label>Nilai Input</label><input id="cVal" type="number" value="10" oninput="calc()">
          <label>Satuan</label><select id="cUnit" onchange="calc()"><option>Ne1</option><option>Nm</option><option>Tex</option><option>Denier</option><option>Grains</option></select></div>
          <div class="card" id="cOut"></div></div>
          <div id="t1" class="tab"><div class="card"><h3>Kalkulator Twist & Draft</h3>
          <div class="g2"><div><label>Satuan Twist</label><select id="tUnit" onchange="calc()"><option value="TPI">TPI (Twist/Inch)</option><option value="TPM">TPM (Twist/Meter)</option></select></div>
          <div><label>Nilai Twist</label><input id="tVal" type="number" value="19" oninput="calc()"></div></div>
          <label>Nomor Benang (Ne1)</label><input id="tNe" type="number" value="10" oninput="calc()">
          <div class="g2"><div><label>Ne Input (Sliver/Roving)</label><input id="dIn" type="number" value="0.12" oninput="calc()"></div>
          <div><label>Ne Output</label><input id="dOut" type="number" value="10" oninput="calc()"></div></div>
          <label>Doubling (Rangkap)</label><input id="dDbl" type="number" value="1" oninput="calc()"></div>
          <div class="card" id="tOut"></div></div>
          <div id="t2" class="tab"><div class="card"><h3>Produksi Mesin (Spin Plan)</h3>
          <div class="g2"><div><label>Speed (RPM)</label><input id="pRpm" type="number" value="80000" oninput="calc()"></div>
          <div><label>Efisiensi (%)</label><input id="pEff" type="number" value="95" oninput="calc()"></div></div>
          <label>Nomor Benang (Ne1)</label><input id="pNe" type="number" value="10" oninput="calc()">
          <div class="g2"><div><label>Satuan Twist</label><select id="pUnit" onchange="calc()"><option value="TPI">TPI (Twist/Inch)</option><option value="TPM">TPM (Twist/Meter)</option></select></div>
          <div><label>Nilai Twist (TPI / TPM)</label><input id="pTw" type="number" value="18.97" oninput="calc()"></div></div>
          <label>Jumlah Spindel / Rotor</label><input id="pSp" type="number" value="180" oninput="calc()"></div>
          <div class="card" id="pOut"></div></div>
          <div id="t3" class="tab"><div class="card"><h3>Timbang Sampel QC</h3>
          <label>Panjang Sampel (Yards: 120 / 30 / 6)</label><input id="qYds" type="number" value="120" oninput="calc()">
          <label>Berat Timbang (Gram)</label><input id="qGr" type="number" value="6.48" oninput="calc()">
          <label>Standar Ne1</label><input id="qStd" type="number" value="10" oninput="calc()"></div>
          <div class="card" id="qOut"></div></div>
          <nav><button class="on" onclick="sw(0)"><i>⇄</i>Konversi</button><button onclick="sw(1)"><i>🌀</i>Twist/Draft</button><button onclick="sw(2)"><i>⚙️</i>Produksi</button><button onclick="sw(3)"><i>⚖️</i>Timbang QC</button></nav>
          <script>
          function sw(n){document.querySelectorAll('.tab').forEach((e,i)=>e.className=i==n?'tab on':'tab');document.querySelectorAll('nav button').forEach((e,i)=>e.className=i==n?'on':'');}
          function r(k,v){return `<div class="row"><span>${k}</span><b>${v}</b></div>`;}
          function calc(){
            let v=+cVal.value||0,u=cUnit.value,ne=u=='Ne1'?v:u=='Nm'?v*.59054:u=='Tex'&&v?590.54/v:u=='Denier'&&v?5314.87/v:v?1000/v:0,gr=ne?1000/ne:0;
            cOut.innerHTML=r('Ne1',ne.toFixed(2))+r('Nm',(ne*1.6934).toFixed(2))+r('Tex',(ne?590.54/ne:0).toFixed(2))+r('Denier',(ne?5314.87/ne:0).toFixed(2))+r('Grains / 120 yds',gr.toFixed(2))+r('Gram / 120 yds',(gr*.0648).toFixed(2));
            let tu=tUnit.value,tv=+tVal.value||0,tn=+tNe.value||0,tpi=tu=='TPI'?tv:tv/39.3701,tpm=tu=='TPM'?tv:tv*39.3701,tm=tn>0?tpi/Math.sqrt(tn):0,di=+dIn.value||0,do_=+dOut.value||0,db=+dDbl.value||1;
            tOut.innerHTML=r('TPI (Twist/Inch)',tpi.toFixed(2))+r('TPM (Twist/Meter)',tpm.toFixed(1))+r('Ekuivalen TM',(tm).toFixed(2))+r('Actual Draft',(di?(do_*db)/di:0).toFixed(2));
            let rpm=+pRpm.value||0,ef=(+pEff.value||0)/100,pn=+pNe.value||0,pu=pUnit.value,ptw=+pTw.value||0,ptpi=pu=='TPI'?ptw:ptw/39.3701,ptpm=pu=='TPM'?ptw:ptw*39.3701,sp=+pSp.value||0,mpm=ptpm?rpm/ptpm:0,gps=ptpi&&pn?((rpm*480*ef)/(ptpi*30240*pn))*453.59:0,kgs=(gps*sp)/1000;
            pOut.innerHTML=r('TPI / TPM',ptpi.toFixed(2)+' / '+ptpm.toFixed(0))+r('Delivery (m/mnt)',mpm.toFixed(2))+r('Gram/Rotor/8 Jam',gps.toFixed(2))+r('Kg/Mesin/Shift',kgs.toFixed(2))+r('Kg/Mesin/24 Jam',(kgs*3).toFixed(2))+r('Bales/Hari @181.44kg',((kgs*3)/181.44).toFixed(3));
            let y=+qYds.value||0,g=+qGr.value||0,st=+qStd.value||0,ane=g?(y*453.592)/(840*g):0,dv=st?((ane-st)/st)*100:0;
            qOut.innerHTML=r('Nomor Aktual (Ne1)',ane.toFixed(2))+r('Berat (Grains)',(g*15.432).toFixed(2))+r('Simpangan (%)',(dv>0?'+':'')+dv.toFixed(2)+'%');
          }
          calc();
          </script></body></html>
          EOF
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Tekstil-APK
          path: build/outputs/apk/debug/*.apk
