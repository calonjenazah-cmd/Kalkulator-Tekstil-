name: Build Android APK Otomatis

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Buat Proyek & Compile APK
        run: |
          mkdir -p app/src/main/java/id/kaluma/textilecalc app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KalkulatorTekstil"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "id.kaluma.textilecalc"
              compileSdk = 34
              defaultConfig {
                  applicationId = "id.kaluma.textilecalc"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Kalkulator Tekstil &amp; QC"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Kalkulator Tekstil &amp; QC</string></resources>
          EOF

          cat << 'EOF' > app/src/main/java/id/kaluma/textilecalc/MainActivity.kt
          @file:OptIn(ExperimentalMaterial3Api::class)
          package id.kaluma.textilecalc

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.util.Locale
          import kotlin.math.sqrt

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val cs = lightColorScheme(
                          primary = Color(0xFF2E5A44),
                          onPrimary = Color.White,
                          primaryContainer = Color(0xFFD8ECE0),
                          onPrimaryContainer = Color(0xFF0F2E1E),
                          secondary = Color(0xFF4A6356),
                          background = Color(0xFFF6F8F6),
                          surface = Color.White
                      )
                      MaterialTheme(colorScheme = cs) {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              MainScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun MainScreen() {
              var tab by remember { mutableIntStateOf(0) }
              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Column {
                                  Text("Kalkulator Tekstil & Spinning QC", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                                  Text("Konversi • Twist & Draft • Produksi • Timbang QC", fontSize = 11.sp, color = Color.White.copy(alpha = 0.85f))
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.primary, titleContentColor = Color.White)
                      )
                  },
                  bottomBar = {
                      NavigationBar {
                          NavigationBarItem(tab == 0, { tab = 0 }, { Icon(Icons.Default.SwapHoriz, null) }, label = { Text("Konversi") })
                          NavigationBarItem(tab == 1, { tab = 1 }, { Icon(Icons.Default.Calculate, null) }, label = { Text("Twist/Draft") })
                          NavigationBarItem(tab == 2, { tab = 2 }, { Icon(Icons.Default.PrecisionManufacturing, null) }, label = { Text("Produksi") })
                          NavigationBarItem(tab == 3, { tab = 3 }, { Icon(Icons.Default.Scale, null) }, label = { Text("Timbang QC") })
                      }
                  }
              ) { p ->
                  Box(Modifier.padding(p).fillMaxSize().padding(16.dp)) {
                      when (tab) {
                          0 -> YarnCountTab()
                          1 -> TwistDraftTab()
                          2 -> ProductionTab()
                          3 -> QcWeighingTab()
                      }
                  }
              }
          }

          @Composable
          fun YarnCountTab() {
              var inp by remember { mutableStateOf("30") }
              var unit by remember { mutableStateOf("Ne1") }
              val units = listOf("Ne1", "Nm", "Tex", "Denier", "Grains/120yds")
              val v = inp.toDoubleOrNull() ?: 0.0
              val ne1 = when (unit) {
                  "Ne1" -> v
                  "Nm" -> v * 0.590541
                  "Tex" -> if (v > 0) 590.541 / v else 0.0
                  "Denier" -> if (v > 0) 5314.87 / v else 0.0
                  "Grains/120yds" -> if (v > 0) 1000.0 / v else 0.0
                  else -> 0.0
              }
              val grains = if (ne1 > 0) 1000.0 / ne1 else 0.0
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  SectionCard("Konversi Nomor Benang") {
                      Inp(inp, "Nilai Nomor Benang") { inp = it }
                      Spacer(Modifier.height(8.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          units.take(3).forEach { u -> FilterChip(unit == u, { unit = u }, { Text(u) }, Modifier.weight(1f)) }
                      }
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          units.drop(3).forEach { u -> FilterChip(unit == u, { unit = u }, { Text(u) }, Modifier.weight(1f)) }
                      }
                  }
                  SectionCard("Hasil Konversi") {
                      ResultRow("Ne1 (English Cotton)", fmt(ne1))
                      ResultRow("Nm (Metric Count)", fmt(ne1 * 1.69336))
                      ResultRow("Tex (g / 1.000 m)", fmt(if (ne1 > 0) 590.541 / ne1 else 
